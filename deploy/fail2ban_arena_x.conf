# ==============================================================================
# ARENA X 2026 // Fail2Ban Security Jail & Filter Configuration
# Place this file in /etc/fail2ban/jail.d/arena_x.local
# ==============================================================================

[arena-admin-auth]
enabled  = true
port     = http,https
filter   = arena-admin-auth
logpath  = /var/log/arena_x/error.log
maxretry = 5
findtime = 600
bantime  = 3600
action   = iptables-multiport[name=ARENAX-ADMIN, port="http,https"]

[arena-probe-scanners]
enabled  = true
port     = http,https
filter   = arena-probe-scanners
logpath  = /var/log/nginx/access.log
maxretry = 3
findtime = 300
bantime  = 7200
action   = iptables-multiport[name=ARENAX-SCANNERS, port="http,https"]
