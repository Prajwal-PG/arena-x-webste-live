# ==============================================================================
# ARENA X 2026 // Production Nginx Configuration
# Target: Hostinger KVM 1 VPS (Ubuntu/Debian)
# Place this file in /etc/nginx/sites-available/arena_x and symlink to /etc/nginx/sites-enabled/
# ==============================================================================

# Rate Limiting Zones (Defense in depth)
limit_req_zone $binary_remote_addr zone=arena_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=arena_register:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=arena_general:10m rate=60r/s;

# ------------------------------------------------------------------------------
# HTTP (Port 80) -> Redirect to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN.COM www.YOUR_DOMAIN.COM; # Replace with your registered domain

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS (Port 443) -> Origin Web Server
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN.COM www.YOUR_DOMAIN.COM; # Replace with your registered domain

    # SSL Certificates (Managed by Certbot or Cloudflare Origin CA)
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN.COM/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.COM/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Max request body size (Matches Flask 3 MB request cap)
    client_max_body_size 3M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Static Assets Root
    root /var/www/arena_x;

    # Security Headers (Defense in depth)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Security: Block hidden files and directories (e.g. .git, .env)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Security: Block sensitive database files, backups, source code, keys, logs, shell scripts
    location ~* \.(db|sqlite|sqlite3|db-wal|db-shm|backup|bak|env|py|pyc|pem|key|crt|cert|log|conf|sh|sql)$ {
        deny all;
        return 404;
    }

    # 1. API Endpoints (Strictly NO CACHE)
    location /api/ {
        limit_req zone=arena_general burst=30 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, private" always;
        add_header Pragma "no-cache" always;
    }

    # 2. Registration API (Rate Limited)
    location /api/register {
        limit_req zone=arena_register burst=5 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, private" always;
    }

    # 3. Admin Authentication & Dashboard (/admin and /admin.html)
    location ~* ^/admin(\.html)?$ {
        limit_req zone=arena_login burst=5 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, private" always;
        add_header Pragma "no-cache" always;
    }

    # 4. Protected Uploads (Gated strictly behind Flask @admin_required)
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "inline" always;
    }

    # 5. Static Assets (Browser Caching)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|webp)$ {
        try_files $uri @proxy;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    }

    # 6. Default Fallback -> Flask Gunicorn Backend
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    location @proxy {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
