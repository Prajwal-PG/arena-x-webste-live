# ==============================================================================
# ARENA X 2026 // Fail2Ban Filter Definitions
# /etc/fail2ban/filter.d/arena-admin-auth.conf & arena-probe-scanners.conf
# ==============================================================================

# Filter: arena-admin-auth
# Matches failed admin authentication attempts in Gunicorn/Flask logs
# Definition:
# [Definition]
# failregex = ^.*WARNING in app: Failed admin authentication attempt from <HOST>.*$
# ignoreregex =

# Filter: arena-probe-scanners
# Matches vulnerability scanner probes looking for php, git, env files
# Definition:
# [Definition]
# failregex = ^<HOST> -.*"(GET|POST|HEAD) /.*(\.env|\.git|phpmyadmin|wp-admin|wp-login|\.bak).* HTTP/.*" 40[34] .*$
# ignoreregex =
