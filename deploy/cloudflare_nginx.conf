# ==============================================================================
# ARENA X 2026 // Production Nginx Configuration for Cloudflare
# Place this file in /etc/nginx/sites-available/arena_x and symlink to sites-enabled
# ==============================================================================

# Rate Limiting Zones (Defense in depth)
limit_req_zone $binary_remote_addr zone=arena_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=arena_register:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=arena_general:10m rate=60r/s;

# ------------------------------------------------------------------------------
# Cloudflare Official IP Ranges for Real-IP Restoration
# Ensures $remote_addr in Nginx and Python backend is the visitor's REAL IP
# ------------------------------------------------------------------------------
# Cloudflare IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;

# ------------------------------------------------------------------------------
# HTTP (Port 80) -> Redirect to HTTPS via Cloudflare
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name arenax.in www.arenax.in; # Replace with your registered domain

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS (Port 443) -> Origin Server
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arenax.in www.arenax.in; # Replace with your registered domain

    # SSL Certificates (Cloudflare Origin CA Certificate or Let's Encrypt)
    ssl_certificate /etc/ssl/certs/cloudflare_origin.pem;
    ssl_certificate_key /etc/ssl/private/cloudflare_origin.key;

    # Modern TLS Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Maximum file upload size (Matches Flask 3 MB request cap)
    client_max_body_size 3M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Root Directory for Static Assets
    root /var/www/arena_x;

    # Security Headers (Defense in depth)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Security: Block hidden files, .git, .env
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
    # Security: Block database files, backups, source code, keys, logs, shell scripts
    location ~* \.(db|sqlite|sqlite3|db-wal|db-shm|backup|bak|env|py|pyc|pem|key|crt|cert|log|conf|sh|sql)$ {
        deny all;
        return 404;
    }

    # 1. API Endpoints (Strictly NO CACHE on Cloudflare or Browser)
    location /api/ {
        limit_req zone=arena_general burst=30 nodelay;
        
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Visitor $http_cf_visitor;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, private" always;
        add_header Pragma "no-cache" always;
    }

    # 2. Registration API (Rate Limited)
    location /api/register {
        limit_req zone=arena_register burst=5 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, private" always;
    }

    # 3. Admin Authentication & Dashboard
    location /admin {
        limit_req zone=arena_login burst=5 nodelay;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0, private" always;
    }

    # 4. Protected Uploads (Gated behind Flask @admin_required)
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # 5. Static Assets (Cachable by Cloudflare Edge CDN)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|webp)$ {
        try_files $uri @proxy;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    }

    # 6. Default Fallback -> Flask Gunicorn Backend
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Visitor $http_cf_visitor;

        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    location @proxy {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }
}
